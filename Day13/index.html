<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Course Registration Form</h1>

    <form action="http://127.0.0.1:5500/Day13/index.html">
      <fieldset>
        <legend>Personal Account</legend>
        <table>
          <tr>
            <td><label for="Name">Name: </label></td>
            <td>
              <input
                type="text"
                name="Name"
                id="Name"
                placeholder="Enter Name"
              />
              <p>Enter your Name</p>
            </td>
          </tr>

          <tr>
            <td><label for="Email">Email: </label></td>
            <td>
              <input type="email" name="Email" placeholder="abc@gmail.com" />
              <p>Enter your Email</p>
              <img src="valid.png" alt="" class="valid" />
              <img src="invalid.png" alt="" class="invalid" />
            </td>
          </tr>
          <tr>
            <td><label for="Password">Password:</label></td>
            <td>
              <input type="text" name="Password" placeholder="asdfghqwert" />
              <p>Enter your password</p>
            </td>
          </tr>
          <tr>
            <td><label for="Age">Age:</label></td>
            <td>
              <input type="number" min="20" max="60" step="1" name="age" />
            </td>
          </tr>
          <tr>
            <td><label for="Phone">Number:</label></td>
            <td>
              <input
                type="tel"
                name="number"
                id="Phone"
                placeholder="12346789"
              />
            </td>
          </tr>
          <tr>
            <td><label for="">Gender:</label></td>
            <td>
              <input type="radio" name="gender" value="Male" id="male" />
              <label for="male">Male</label>
              <input type="radio" name="gender" value="Female" />
              <label for="">Female</label>
              <input type="radio" name="gender" value="Other" />
              <label for="">Others</label>
            </td>
          </tr>
          <tr>
            <td><label for="">State:</label></td>
            <td>
              <select name="state" id="">
                <option value="">Select Option</option>
                <option value="Tamil Nadu">Tamil Nadu</option>
                <option value="Banglore">Banglore</option>
                <option value="Andhra Pradesh">Andhra Pradesh</option>
              </select>
            </td>
          </tr>
          <tr>
            <td><label for="documenta">Documents:</label></td>
            <td><input type="file" name="documents" id="documents" /></td>
          </tr>

          <tr>
            <td><label for="">Commnts:</label></td>
            <td>
              <textarea
                name=""
                id=""
                placeholder="enter your comments"
                name="comments"
              ></textarea>
            </td>
          </tr>
          <tr>
            <td colspan="2">
              <button type="submit" class="submit">Submit</button>
            </td>
          </tr>
        </table>
      </fieldset>
    </form>
  </body>
</html>
